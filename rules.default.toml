# mac-organizer v2
# Default routing rules for mac-organizer.
# Rules are evaluated top-to-bottom per source folder; first match wins.
# Unmatched files are left where they are.
# Personal rules and [smart_sort] settings go in rules.local.toml (git-ignored);
# its rules are evaluated before these.

# --- Screenshots -----------------------------------------------------------
[[rule]]
source = "@@SCREENSHOT_DIR@@"
glob = "Screenshot *"
ext = ["png", "jpg", "jpeg"]
action = "move_and_timestamp"
dest = "~/Media/Screenshots/%Y-%m"

[[rule]]
source = "@@SCREENSHOT_DIR@@"
glob = "Screen Recording *"
ext = ["mov", "mp4"]
action = "move_and_timestamp"
dest = "~/Media/Screenshots/%Y-%m"

# --- Desktop: .app bundles to Installers, everything else to the inbox -----
[[rule]]
source = "~/Desktop"
kind = "dir"
ext = ["app"]
action = "move"
dest = "~/Downloads/Installers"

[[rule]]
source = "~/Desktop"
action = "move"
dest = "~/Inbox"
min_age_seconds = 60

# --- Downloads -----------------------------------------------------------
[[rule]]
source = "~/Downloads"
ext = ["png", "jpg", "jpeg", "gif", "webp", "heic", "svg"]
action = "move"
dest = "~/Media/Images"

[[rule]]
source = "~/Downloads"
ext = ["mp3", "m4a", "wav", "aac", "flac", "aiff"]
action = "move"
dest = "~/Media/Audio"

[[rule]]
source = "~/Downloads"
ext = ["mov", "mp4", "m4v", "mkv", "avi", "webm"]
action = "move"
dest = "~/Media/Video"

[[rule]]
source = "~/Downloads"
ext = ["md", "markdown", "txt"]
action = "move"
dest = "~/Notes/00-Inbox"

[[rule]]
source = "~/Downloads"
ext = ["dmg", "pkg"]
action = "move"
dest = "~/Downloads/Installers"

[[rule]]
source = "~/Downloads"
ext = ["pem", "p12", "pfx", "cer", "crt", "asc", "gpg", "pgp"]
action = "move"
dest = "~/Documents/Keys"

[[rule]]
source = "~/Downloads"
ext = ["ics"]
action = "trash"
min_age_seconds = 86400

# A calendar file younger than a day waits (it is trashed once a day old).
[[rule]]
source = "~/Downloads"
ext = ["ics"]
action = "skip"

[[rule]]
source = "~/Downloads"
ext = ["zip", "tar", "gz", "tgz"]
has_installer = true
action = "move"
dest = "~/Downloads/Installers"

[[rule]]
source = "~/Downloads"
ext = ["zip", "tar", "gz", "tgz"]
action = "smart"
dest = "~/Documents/Misc"

[[rule]]
source = "~/Downloads"
ext = ["pdf", "doc", "docx", "pages", "xls", "xlsx", "csv", "ppt", "pptx", "key", "rtf"]
action = "smart"
dest = "~/Documents/Misc"

[[rule]]
source = "~/Downloads"
ext = ["ipynb", "py", "m", "slx", "html", "php", "js", "ts", "json", "yaml", "yml", "sql", "sh"]
action = "smart"
dest = "~/Documents/Misc"

# Folders (Downloads only): .app bundles to Installers, the rest sorted by the model.
[[rule]]
source = "~/Downloads"
kind = "dir"
ext = ["app"]
action = "move"
dest = "~/Downloads/Installers"

[[rule]]
source = "~/Downloads"
kind = "dir"
action = "smart"
dest = "~/Documents/Misc"

# Anything no rule above places, and anything the model is unsure of, goes to Misc.
[[rule]]
source = "~/Downloads"
action = "move"
dest = "~/Documents/Misc"

